<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#4d6bfe" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <!-- 配对页 -->
    <section id="view-pair" class="view view-pair">
      <div class="pair-brand">
        <div class="pair-logo" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M23.0584 4.95203C22.8129 4.83203 22.7074 5.06103 22.5639 5.17704C22.5149 5.21454 22.4734 5.26354 22.4319 5.30854C22.0734 5.69155 21.6543 5.94306 21.1073 5.91306C20.3073 5.86806 19.6243 6.11957 19.0203 6.73158C18.8918 5.97706 18.4652 5.52655 17.8162 5.23754C17.4767 5.08753 17.1332 4.93703 16.8952 4.61052C16.7292 4.37801 16.6837 4.11901 16.6007 3.8635C16.5477 3.70949 16.4952 3.55199 16.3177 3.52549C16.1252 3.49549 16.0497 3.65699 15.9742 3.792C15.6722 4.34401 15.5552 4.95203 15.5667 5.56805C15.5932 6.95359 16.1782 8.05712 17.3407 8.84215C17.4727 8.93215 17.5067 9.02215 17.4652 9.15366C17.3857 9.42416 17.2917 9.68667 17.2087 9.95718C17.1557 10.1297 17.0767 10.1677 16.8917 10.0922C16.2537 9.82568 15.7027 9.43117 15.2156 8.95465C14.3891 8.15513 13.6416 7.2726 12.7096 6.58158C12.4906 6.42007 12.2716 6.27007 12.045 6.12707C11.094 5.20354 12.1696 4.44502 12.4186 4.35501C12.6791 4.26101 12.5091 3.938 11.6675 3.942C10.826 3.9455 10.056 4.22751 9.07446 4.60302C8.93096 4.65952 8.77995 4.70052 8.62545 4.73452C7.73492 4.56552 6.80989 4.52802 5.84386 4.63702C4.02481 4.83953 2.57177 5.69955 1.50373 7.1676C0.220694 8.93215 -0.0813148 10.9372 0.288196 13.0283C0.676708 15.2323 1.80174 17.0569 3.53029 18.4834C5.32285 19.9625 7.38741 20.6875 9.74298 20.5485C11.1735 20.466 12.7661 20.2745 14.5626 18.7539C15.0156 18.9795 15.4912 19.0695 16.2797 19.137C16.8872 19.1935 17.4722 19.107 17.9252 19.013C18.6347 18.8629 18.5857 18.2059 18.3292 18.0854C16.2497 17.1169 16.7062 17.5109 16.2912 17.1919C17.3477 15.9419 18.9618 13.7198 19.4598 10.6942C19.5088 10.3602 19.5713 9.88968 19.5638 9.61917C19.5598 9.45417 19.5978 9.39016 19.7863 9.37116C20.3073 9.31116 20.8128 9.16866 21.2773 8.91315C22.6249 8.17713 23.1684 6.96809 23.2964 5.51905C23.3154 5.29754 23.2924 5.06853 23.0584 4.95203ZM11.3165 17.9954C9.30097 16.4109 8.32344 15.8894 7.91992 15.9119C7.54241 15.9344 7.61042 16.3664 7.69342 16.6479C7.78042 16.9259 7.8         </div>
        <h1>DeepSeek Harness</h1>
        <p class="pair-sub">连接电脑端，状态同屏</p>
      </div>
      <form id="pair-form" class="pair-form" autocomplete="off">
        <label class="field">
          <span>电脑地址</span>
          <input id="pair-host" type="url" inputmode="url" placeholder="http://192.168.x.x:17890" required />
        </label>
        <label class="field">
          <span>配对码</span>
          <input id="pair-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位数字" required />
        </label>
        <label class="field">
          <span>设备名称</span>
          <input id="pair-name" type="text" maxlength="32" placeholder="我的手机" />
        </label>
        <button type="submit" class="btn-primary" id="pair-submit">连接电脑</button>
        <p class="pair-hint" id="pair-hint">在电脑「软件设置 → 手机连接」中查看地址与配对码</p>
        <p class="pair-error" id="pair-error" hidden></p>
      </form>
    </section>

    <!-- 主聊天 -->
    <section id="view-chat" class="view view-chat" hidden>
      <header class="chat-header">
        <button type="button" class="icon-btn" id="btn-sessions" aria-label="会话列表">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <div class="chat-title-wrap">
          <div class="chat-title" id="chat-title">新会话</div>
          <button type="button" class="model-chip" id="btn-model">
            <span id="model-label">选择模型</span>
            <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5 L5 6.5 L8 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
        <span class="conn-light" id="conn-light" title="连接状态" aria-label="连接状态"></span>
        <button type="button" class="icon-btn" id="btn-more" aria-label="更多">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
      </header>

      <div class="chat-status" id="chat-status" hidden></div>

      <main class="chat-stream" id="chat-stream">
        <div class="chat-empty" id="chat-empty">
          <div class="chat-empty-logo">
            <span class="ds-run-mark static" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="chat-empty-title">有什么可以帮你？</div>
          <div class="chat-empty-sub">与电脑端同一会话，消息实时同步</div>
        </div>
      </main>
      <button type="button" class="scroll-bottom" id="btn-scroll-bottom" hidden aria-label="回到底部">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>

      <footer class="chat-composer">
        <div id="queue-list" class="queue-list" hidden></div>
        <div class="composer-box">
          <textarea id="composer-input" rows="1" placeholder="给 DeepSeek Harness 发送消息" enterkeyhint="send"></textarea>
          <button type="button" class="send-btn" id="btn-send" disabled aria-label="发送">
            <svg class="ico-send" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.6l17.45-7.48c.81-.35.81-1.49 0-1.84L3.4 3.82c-.66-.28-1.39.17-1.39.89v5.57c0 .45.28.85.71 1.01l11.2 2.95-11.2 2.95c-.43.16-.71.56-.71 1.01v5.57c0 .72.73 1.17 1.39.89z"/></svg>
            <svg class="ico-stop" width="14" height="14" viewBox="0 0 14 14" fill="currentColor" hidden><rect x="2" y="2" width="10" height="10" rx="2"/></svg>
          </button>
        </div>
      </footer>
    </section>

    <!-- 会话列表抽屉 -->
    <div id="drawer-sessions" class="drawer" hidden>
      <div class="drawer-backdrop" data-close="sessions"></div>
      <aside class="drawer-panel">
        <div class="drawer-head">
          <div class="drawer-title" id="drawer-title">会话与项目</div>
          <div class="drawer-head-actions">
            <button type="button" class="icon-btn text-btn" id="btn-select-mode" hidden>选择</button>
            <button type="button" class="icon-btn text-btn" id="btn-select-cancel" hidden>取消</button>
            <button type="button" class="icon-btn" data-close="sessions" aria-label="关闭">
              <svg width="14" height="14" viewBox="0 0 12 12"><path d="M1 1 L11 11 M11 1 L1 11" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>
        </div>
        <div class="select-bar" id="select-bar" hidden>
          <button type="button" class="drawer-action" id="btn-select-all">全选</button>
          <button type="button" class="drawer-action danger" id="btn-batch-delete">删除</button>
        </div>
        <div class="drawer-actions" id="drawer-actions">
          <button type="button" class="drawer-action primary" id="btn-new-session-drawer">新建会话</button>
          <button type="button" class="drawer-action" id="btn-new-project">新建项目</button>
        </div>
        <div class="session-list" id="session-list"></div>
      </aside>
    </div>

    <!-- 新建项目 -->
    <div id="sheet-project" class="sheet" hidden>
      <div class="sheet-backdrop" data-close="project"></div>
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <div class="sheet-title">新建项目</div>
        <div class="sheet-sub">将在电脑上创建项目文件夹</div>
        <label class="field" style="margin-top:12px;">
          <span>项目名称</span>
          <input id="project-name" type="text" maxlength="64" placeholder="例如：MyApp" />
        </label>
        <div class="project-path-hint" id="project-path-hint">路径：—</div>
        <div class="sheet-actions">
          <button type="button" class="more-item" data-close="project">取消</button>
          <button type="button" class="more-item primary" id="btn-create-project">创建</button>
        </div>
      </div>
    </div>

    <!-- 模型选择 -->
    <div id="sheet-model" class="sheet" hidden>
      <div class="sheet-backdrop" data-close="model"></div>
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <div class="sheet-title">选择模型</div>
        <div class="sheet-sub">来自电脑端已配置的模型</div>
        <div class="model-list" id="model-list"></div>
      </div>
    </div>

    <!-- 更多 -->
    <div id="sheet-more" class="sheet" hidden>
      <div class="sheet-backdrop" data-close="more"></div>
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <div class="sheet-title">更多</div>
        <div class="more-actions">
          <button type="button" class="more-item" id="btn-cancel-turn">停止生成</button>
          <button type="button" class="more-item" id="btn-refresh">刷新状态</button>
          <button type="button" class="more-item danger" id="btn-disconnect">断开连接</button>
        </div>
      </div>
    </div>

    <!-- 会话操作 -->
    <div id="sheet-session-actions" class="sheet" hidden>
      <div class="sheet-backdrop" data-close="session-actions"></div>
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="session-actions-title">会话操作</div>
        <div class="more-actions">
          <button type="button" class="more-item" id="btn-rename-session">重命名</button>
          <button type="button" class="more-item danger" id="btn-delete-session">删除会话</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/md.js"></script>
  <script src="/app.js"></script>
</body>
</html>
